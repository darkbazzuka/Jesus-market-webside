<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Jesus market</title>
</head>
<body>
    <div id="status" style="font-family: monospace; padding: 20px;">Loading market...</div>

    <script type="text/javascript">
    (function() {
        var USERNAME = "darkbazzuka";
        var REPO = "Jesus-market-recipes";
        var BRANCH = "Html";
        var TARGET_FILE = "index.html"; // Or whatever your main UI file is named in the repo
        var GITHUB_TOKEN = "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";

        var rawUrl = "https://raw.githubusercontent.com/" + USERNAME + "/" + REPO + "/" + BRANCH + "/" + TARGET_FILE;
        var xhr = new XMLHttpRequest();
        xhr.open("GET", rawUrl, true);
        
        if (GITHUB_TOKEN !== "") {
            xhr.setRequestHeader("Authorization", "token " + GITHUB_TOKEN);
        }
        
        xhr.onreadystatechange = function() {
            if (xhr.readyState === 4) {
                if (xhr.status === 200) {
                    // Cleanly parse and replace the page body/content natively
                    var parser = new DOMParser();
                    var doc = parser.parseFromString(xhr.responseText, "text/html");
                    document.open();
                    document.write(doc.documentElement.innerHTML);
                    document.close();
                } else {
                    document.getElementById("status").innerHTML = "Failed to load market (Status: " + xhr.status + ")";
                }
            }
        };
        xhr.send();
    })();
    </script>
</body>
</html>
